{% extends 'base.html' %}
{% block title %}Acceso Dueño — JARVIS ALL SPORT{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto; background: white; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
    
    <h2 style="text-align: center; color: #0f172a; margin-bottom: 10px; font-size: 1.6rem;">🔒 Acceso Dueño</h2>
    <p style="text-align: center; color: #64748b; margin-bottom: 25px; font-size: 0.95rem;">Solo el administrador puede entrar aquí</p>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label style="font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Usuario</label>
            <input type="text" name="username" required style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem;">
        </div>
        
        <div style="margin-bottom: 25px;">
            <label style="font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Contraseña</label>
            <input type="password" name="password" required style="width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem;">
        </div>
        
        <button type="submit" class="btn btn-grande" style="width: 100%; background: #0f172a; color: white; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; border: none;">
            Ingresar al Panel
        </button>
    </form>

</div>
{% endblock %}
