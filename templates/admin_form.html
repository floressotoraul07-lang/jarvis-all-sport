{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Editar' if sneaker else 'Agregar' }} Zapatilla</h2>
<form method="POST" enctype="multipart/form-data" class="form-admin">
    <div class="form-grid">
        <p><label>Nombre *</label><input type="text" name="nombre" required value="{{ sneaker.nombre if sneaker else '' }}"></p>
        <p><label>Marca *</label>
            <select name="marca" required>
                {% for m in marcas %}
                <option value="{{ m }}" {{ 'selected' if sneaker and sneaker.marca == m else '' }}>{{ m }}</option>
                {% endfor %}
            </select>
        </p>
        <p><label>Código</label><input type="text" name="codigo" placeholder="Ej: 750SMA0077APE" value="{{ sneaker.codigo if sneaker else '' }}"></p>
        <p><label>Género</label>
            <select name="genero">
                {% for g in ['Caballero', 'Dama', 'Niño', 'Niña', 'Unisex'] %}
                <option value="{{ g }}" {{ 'selected' if sneaker and sneaker.genero == g else '' }}>{{ g }}</option>
                {% endfor %}
            </select>
        </p>
        <p><label>Categoría</label>
            <select name="categoria">
                {% for c in ['Adulto', 'Niño'] %}
                <option value="{{ c }}" {{ 'selected' if sneaker and sneaker.categoria == c else '' }}>{{ c }}</option>
                {% endfor %}
            </select>
        </p>
        <p><label>Precio *</label><input type="number" step="0.01" name="precio" required value="{{ sneaker.precio if sneaker else '' }}"></p>
        <p><label>Precio antes (oferta)</label><input type="number" step="0.01" name="precio_oferta" value="{{ sneaker.precio_oferta if sneaker and sneaker.precio_oferta else '' }}"></p>
    </div>
    <p><label>Descripción</label><textarea name="descripcion" rows="3">{{ sneaker.descripcion if sneaker else '' }}</textarea></p>
    <p><label>Imagen</label><input type="file" name="imagen" accept="image/*"></p>
    <hr>
    <h3>Tallas y stock</h3>
    <p class="ayuda">Ejemplos de tallas: 39.5, 40, 41, 42</p>
    <div id="inv">
        {% for inv in inventarios %}
        <div class="fila-inv">
            <input type="text" name="talla[]" value="{{ inv.size.numero }}" placeholder="Talla">
            <input type="number" name="cantidad[]" value="{{ inv.cantidad }}" placeholder="Cantidad">
            <button type="button" class="btn btn-peligro quitar">✕</button>
        </div>
        {% endfor %}
        {% if not inventarios %}
        <div class="fila-inv">
            <input type="text" name="talla[]" placeholder="Talla">
            <input type="number" name="cantidad[]" placeholder="Cantidad">
            <button type="button" class="btn btn-peligro quitar">✕</button>
        </div>
        {% endif %}
    </div>
    <button type="button" onclick="document.getElementById('inv').insertAdjacentHTML('beforeend','<div class=\'fila-inv\'><input type=text name=talla[] placeholder=Talla><input type=number name=cantidad[] placeholder=Cantidad><button type=button class=\'btn btn-peligro quitar\'>✕</button></div>')">+ Otra talla</button>
    <br><br>
    <button type="submit" class="btn">Guardar</button>
    <a class="btn btn-secundario" href="{{ url_for('admin_dashboard') }}">Cancelar</a>
</form>

<script>
document.addEventListener('click', e => {
    if (e.target.classList.contains('quitar')) e.target.closest('.fila-inv').remove();
});
</script>
{% endblock %}
